<body>
<!-- STAGE（クリックで次へ） -->
<div id="stage">
<div id="slideContent">

</div>
</div>
<!-- プログレスドット（常時表示） -->

<div id="pageFrame">
<div class="pf-border-outer"></div>
<div class="pf-border-inner"></div>

</div>
<!-- SESSION PICKER OVERLAY -->
<div id="sessionOverlay">
<div id="sessionBox">
<div class="sb-title">発表するセッションを選択</div>
<div class="sb-sub">集計ツールで作成したセッションを読み込みます</div>
<div class="sb-conn">
<input type="text" id="poUrl" placeholder="https://xxxx.supabase.co">
<input type="text" id="poKey" placeholder="anon key (eyJ...)">
<button onclick="connectAndLoad()">接続</button>
<span id="sbStatusBadge">未接続</span>
</div>
<div style="margin-bottom:12px">
<label style="display:block;font-size:11px;color:var(--text2);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase">セッション</label>
<div style="display:flex;gap:8px;align-items:center">
<select id="sessSelect" style="flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text0);border-radius:5px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;cursor:pointer">
<option value="">-- 接続してセッションを取得 --</option>
</select>
<button onclick="fetchSessions()" style="white-space:nowrap;font-size:11px;padding:8px 12px;border-radius:5px;border:1px solid var(--border2);background:var(--bg2);color:var(--text1);cursor:pointer">更新</button>
</div>

<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px">

<div style="background:var(--bg1);border:2px solid var(--red);border-radius:14px;padding:32px 44px;min-width:340px;max-width:90vw;text-align:center;box-shadow:0 0 56px rgba(196,62,58,.5)">

<div style="font-size:14px;color:var(--text1);line-height:1.6">再接続を試行しています...<br>このまま少々お待ちください。</div>

<div style="font-size:16px;color:var(--text2);margin-bottom:8px;letter-spacing:.06em">セッション読み込み完了</div>
<div style="font-size:22px;font-weight:700;color:var(--gold);margin-bottom:24px;letter-spacing:.05em">どこから開始しますか？</div>
<div style="display:flex;flex-direction:column;gap:10px">
<button onclick="startFrom('rule')" class="sp-btn">① ルール説明から開始</button>
<button onclick="startFrom('place')" class="sp-btn">② 場所決め投票から開始</button>
<button onclick="startFrom('main')" class="sp-btn">③ 本投票から開始</button>
</div>
</div>

function buildSlides(){
slides=[];
// 裏ルール（〈流れ〉／永久ロック／不可視線）はプレイヤー向けルール説明には出さない
// → ディーラー側の集計ツールでのみ可視化・運用される
const ruleIds=[
'blank-intro','game-title','goal','loan','amida','flow','place-vote',
...(N%2===1 ? ['phantom'] : []),
'cards','minus','plus','collision',
'vote-rights',
'route','survivor',
// 賞金モードBの場合のみ prize-share を表示（モード差はプレイヤーにも明示）
...(rulesConfig.prizeMode==='B' ? ['prize-share'] : []),
'winner','prohibited','dealer','qa'
];
ruleIds.forEach((rid,idx)=>{
slides.push({type:'rule', ruleId:rid, ruleIdx:idx+1, ruleTotal:ruleIds.length});
});
slides.push({type:'eyecatch'});
const hasAlpha=players.some(p=>p&&p.alpha);
// ブラフ強化: hidePlaceResults モード時は結果発表系スライド(place-pre-result / place-round)を完全に省略
const _hidePR = rulesConfig.hidePlaceResults;
if(placeHistory.length>0 || hasAlpha){
const playedRounds=placeHistory.filter(h=>h.round!=='random').length;
const showRounds=Math.max(1, Math.min(3, playedRounds||1));
let stop=false;
for(let r=1; r<=showRounds && !stop; r++){
slides.push({type:'place-init', round:r});
slides.push({type:'place-timer', round:r, durationSec: r===1?600:300});
if(!_hidePR) slides.push({type:'place-pre-result', round:r});
const h=placeHistory.find(x=>x.round===r);
if(h){
const idx=placeHistory.indexOf(h);
if(!_hidePR) slides.push({type:'place-round', roundData:h, roundIndex:idx, totalRounds:placeHistory.length});
if(Object.keys(h.fixed||{}).length>=N) stop=true;
}
}
const randomEntry=placeHistory.find(h=>h.round==='random');
if(randomEntry && !_hidePR){
const idx=placeHistory.indexOf(randomEntry);
slides.push({type:'place-pre-result', round:'random'});
slides.push({type:'place-round', roundData:randomEntry, roundIndex:idx, totalRounds:placeHistory.length});
}
}
if(hasAlpha){
slides.push({type:'place-amida'});
slides.push({type:'honsen-start'});  // 本戦突入の節目スライド
}
for(let t=1;t<=totalTurns;t++){
slides.push({type:'turn-start',turn:t});
slides.push({type:'amida',turn:t,bars:[...turnSnapshots[t-1]]});
slides.push({type:'tallying',turn:t});                                       // 集計中
slides.push({type:'result-announce',turn:t});                                // 結果発表
slides.push({type:'amida-before-result',turn:t,bars:[...turnSnapshots[t-1]]});// 結果前のアミダ（変化を比較するための「前」）
slides.push({type:'amida-result',turn:t,bars:[...turnSnapshots[t]]});         // 結果後のアミダ
}
slides.push({type:'final-tally'});   // 最終集計中
slides.push({type:'final-reveal'});
}
function barLabel(idx,n){
const row=Math.floor(idx/n);
// 拡張ルール: 不可視線ON時は row 0 を "0"、それ以外は row+1
const num = rulesConfig.hiddenLines ? row : (row+1);
return ALPHA[idx%n]+num;
}
function isPhantom(p){ return !!(p && p.isPhantom); }
function realPlayersOnly(){ return players.filter(p=>!isPhantom(p)); }
function _barLevel(row, sector, n){
if(n%2===1 && sector===n-1) return (row+1) + 0.25;
return (row+1) + (sector%2===0 ? 0 : 0.5);
}
function _getSpokeBars(spokeIdx, n, totalRows){
const out=[];
for(let row=0;row<totalRows;row++){
const sR=spokeIdx, sL=(spokeIdx-1+n)%n;
out.push({row,sector:sR,side:'R',level:_barLevel(row,sR,n),idx:row*n+sR});
out.push({row,sector:sL,side:'L',level:_barLevel(row,sL,n),idx:row*n+sL});
}
out.sort((a,b)=>b.level-a.level);
return out;
}
function _getAllBarsByLevel(barsData, n, totalRows){
const all=[];
for(let row=0;row<totalRows;row++) for(let sector=0;sector<n;sector++){
const idx=row*n+sector;
all.push({idx,row,sector,level:_barLevel(row,sector,n),alive:!!barsData[idx]});
}
all.sort((a,b)=>b.level-a.level);
return all;
}
function traceRouteStatic(barsData,start,n){
const totalRows=Math.ceil(barsData.length/n);
const allBars=_getAllBarsByLevel(barsData,n,totalRows);
const spokeBars={};
for(let i=0;i<n;i++) spokeBars[i]=_getSpokeBars(i,n,totalRows);
let cur=start, curSegIdx=0;
const vB=new Set(), vS=new Set();
vS.add(`${cur}:0`);
for(const bar of allBars){
if(!bar.alive) continue;
// 拡張ルール: 不可視線・永久ロックは通過不可
if(isHidden(bar.idx)) continue;
if(isLocked(bar.idx)) continue;
let newCur;
if(bar.sector===cur) newCur=(cur+1)%n;
else if(bar.sector===((cur-1+n)%n)) newCur=(cur-1+n)%n;
else continue;
const cIdx=spokeBars[cur].findIndex(b=>b.idx===bar.idx);
const nIdx=spokeBars[newCur].findIndex(b=>b.idx===bar.idx);
if(cIdx<0||nIdx<0) continue;
for(let s=curSegIdx;s<=cIdx;s++) vS.add(`${cur}:${s}`);
vB.add(bar.idx); cur=newCur; curSegIdx=nIdx+1;
vS.add(`${cur}:${curSegIdx}`);
}
const finalMax=spokeBars[cur].length+1;  // +1 for center
for(let s=curSegIdx;s<=finalMax;s++) vS.add(`${cur}:${s}`);
return{bars:vB,spokes:vS,end:cur};
}
const SURVIVOR_PALETTE=['#ef9f27','#ff5a3a','#5aa0ff','#5dcaa5','#9f8fef','#ffd24a','#ff8ec4','#7adee6'];
function computeFinalHighlight(barsData, n){
if(!players.length) return null;
const routes=players.map((_,p)=>traceRouteStatic(barsData, p, n));
const realLens=routes.map((r,p)=>isPhantom(players[p])?Infinity:r.bars.size);
const minLen=Math.min(...realLens);
const bars=new Set(), spokes=new Set();
const survivors=[];
routes.forEach((r,p)=>{
if(isPhantom(players[p])) return;
if(r.bars.size!==minLen) return;
r.bars.forEach(idx=>bars.add(idx));
r.spokes.forEach(k=>spokes.add(k));
survivors.push({playerIdx:p, bars:r.bars, spokes:r.spokes});
});
const multi=survivors.length>1;
survivors.forEach((s,i)=>{ s.color=multi?SURVIVOR_PALETTE[i%SURVIVOR_PALETTE.length]:'#ef9f27'; });
return {bars, spokes, minLen, survivors};
}
function buildPlaceAmidaSVG(barsData, fixed, prevFixed, tallyByAlpha, newlyFixed, isRandom){
// ブラフ強化: 場所決め結果を非表示モード → 確定情報を全て空に
if(rulesConfig.hidePlaceResults){
  fixed={}; prevFixed={}; tallyByAlpha={}; newlyFixed=new Set(); isRandom=false;
}
const n=N, angle=360/n;
const R=260, r1=100, r2=235;
const tRows=Math.ceil(barsData.length/n);
const zigAmt=(r2-r1)/(tRows+1)*0.6;
function zigShift(s){
const isLastOddN=(n%2===1 && s===n-1);
return isLastOddN?zigAmt*0.5:(s%2===1?zigAmt:0);
}
let h='';
for(let i=0;i<n;i++){
const a=(i*angle-90)*Math.PI/180;
const px=(R+52)*Math.cos(a), py=(R+52)*Math.sin(a);
const ox=r2*Math.cos(a), oy=r2*Math.sin(a);
const ix=r1*Math.cos(a), iy=r1*Math.sin(a);
h+=`<line x1="0" y1="0" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="#222220" stroke-width="1.5"/>`;
h+=`<line x1="${ix.toFixed(1)}" y1="${iy.toFixed(1)}" x2="${ox.toFixed(1)}" y2="${oy.toFixed(1)}" stroke="#6a6a64" stroke-width="4" stroke-linecap="round"/>`;
}
barsData.forEach((alive,idx)=>{
const s=idx%n, row=Math.floor(idx/n);
const zs=zigShift(s);
const t=(row+1)/(tRows+1);
const rr=r1+(r2-r1)*t+zs;
const a1=(s*angle-90)*Math.PI/180;
const a2=((s+1)%n*angle-90)*Math.PI/180;
const x1=rr*Math.cos(a1),y1=rr*Math.sin(a1),x2=rr*Math.cos(a2),y2=rr*Math.sin(a2);
h+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#3a3a38" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>`;
});
const fsAlpha = n<=8?24:n<=12?21:18;
const fsStatus= n<=8?15:n<=12?13:11;
const fsName  = n<=8?16:n<=12?14:12;
for(let i=0;i<n;i++){
const a=(i*angle-90)*Math.PI/180;
const lx=(R+52)*Math.cos(a), ly=(R+52)*Math.sin(a);
const alpha=ALPHA[i];
const isPrevFixed=Object.keys(prevFixed).includes(alpha);
const isFixed=Object.keys(fixed).includes(alpha);
const isNew=newlyFixed.has(alpha);
let bgColor, strokeColor, alphaColor, statusText, statusColor;
if(isPrevFixed&&!isNew){
bgColor='rgba(30,60,40,.8)'; strokeColor='#5dcaa5';
alphaColor='#5dcaa5'; statusText='確定済み'; statusColor='#5dcaa5';
} else if(isNew||isRandom){
bgColor='rgba(20,70,45,.9)'; strokeColor='#3dffc4';
alphaColor='#3dffc4'; statusText='✓ 確定'; statusColor='#3dffc4';
} else {
bgColor='rgba(20,20,20,.7)'; strokeColor='#444441';

o.frequency.linearRampToValueAtTime(800, t+0.36);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(0.22, t+0.01);
g.gain.setValueAtTime(0.22, t+0.34);

function _ruleAmidaSVG(n, withRoute, opts){
opts = opts || {};
const R=180, r1=50, r2=160;
const tRows=opts.rows || (barsPerSector||7);
const angle=360/n;
function zigShift(s){
const isLastOddN=(n%2===1 && s===n-1);
const zigAmt=(r2-r1)/(tRows+1)*0.55;
if(isLastOddN) return zigAmt*0.5;
return s%2===1 ? zigAmt : 0;
}
const totalBars=n*tRows;
const barsAlive=new Array(totalBars).fill(true);
if(withRoute){
const ratio = opts.deleteRatio!=null ? opts.deleteRatio : 0.5;
let seed=(n*1000+tRows)|0;
const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
for(let i=0;i<totalBars;i++){
if(rnd()<ratio) barsAlive[i]=false;
}
}
const barCoord=new Array(totalBars);
for(let row=0;row<tRows;row++){
for(let s=0;s<n;s++){
const zs=zigShift(s);
const t=(row+1)/(tRows+1);
const rr=r1+(r2-r1)*t+zs;
const a1=(s*angle-90)*Math.PI/180;
const a2=((s+1)%n*angle-90)*Math.PI/180;
barCoord[row*n+s]={
x1:rr*Math.cos(a1), y1:rr*Math.sin(a1),
x2:rr*Math.cos(a2), y2:rr*Math.sin(a2),
rr, row, s
};
}
}
const spokeXY=[];
for(let i=0;i<n;i++){
const a=(i*angle-90)*Math.PI/180;
spokeXY.push({x1:r1*Math.cos(a), y1:r1*Math.sin(a), x2:r2*Math.cos(a), y2:r2*Math.sin(a), ax:Math.cos(a), ay:Math.sin(a)});
}
let h='';
for(let i=0;i<n;i++){
const p=spokeXY[i];
h+=`<line class="mini-spoke" x1="${p.x1.toFixed(1)}" y1="${p.y1.toFixed(1)}" x2="${p.x2.toFixed(1)}" y2="${p.y2.toFixed(1)}"/>`;
const a=(i*angle-90)*Math.PI/180;
const lx=(r2+18)*Math.cos(a), ly=(r2+18)*Math.sin(a);
h+=`<text class="mini-spoke-label" x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle">${ALPHA[i]}</text>`;
}
let barCount=0;
for(let row=0;row<tRows;row++){
for(let s=0;s<n;s++){
const idx=row*n+s;
const c=barCoord[idx];
const alive=barsAlive[idx];
const delay=barCount*0.02;
const cls=alive ? 'mini-bar show' : 'mini-bar-dead';
h+=`<line class="${cls}" x1="${c.x1.toFixed(1)}" y1="${c.y1.toFixed(1)}" x2="${c.x2.toFixed(1)}" y2="${c.y2.toFixed(1)}" style="animation-delay:${(0.5+delay).toFixed(2)}s"/>`;
barCount++;
}
}
h+=`<circle cx="0" cy="0" r="6" fill="#e24b4a"/>`;
if(withRoute){
function traceLocalRoute(start){
const all=[];
for(let row=0;row<tRows;row++) for(let sector=0;sector<n;sector++){
const idx=row*n+sector;
if(!barsAlive[idx]) continue;
const lv = (n%2===1 && sector===n-1) ? (row+1)+0.25 : (row+1)+(sector%2===0?0:0.5);
all.push({idx, sector, lv});
}
all.sort((a,b)=>b.lv-a.lv);
const visitedBars=[];
let cur=start;
for(const b of all){
if(b.sector===cur){ visitedBars.push(b.idx); cur=(cur+1)%n; }
else if(b.sector===((cur-1+n)%n)){ visitedBars.push(b.idx); cur=(cur-1+n)%n; }
}
return {visitedBars, endSpoke:cur, length:visitedBars.length};
}
let best=null, bestStart=0;
if(opts.traceFrom!=null && opts.traceFrom!=='shortest'){
bestStart=opts.traceFrom;
best=traceLocalRoute(bestStart);
} else {
for(let st=0;st<n;st++){
const r=traceLocalRoute(st);
if(!best || r.length<best.length){ best=r; bestStart=st; }
}
}
const startA=(bestStart*angle-90)*Math.PI/180;
const ox=(r2+10)*Math.cos(startA), oy=(r2+10)*Math.sin(startA);
const pts=[`M ${ox.toFixed(1)} ${oy.toFixed(1)}`];
let curSpoke=bestStart;
for(const bIdx of best.visitedBars){
const c=barCoord[bIdx];
let cur=spokeXY[curSpoke];
const nextSpoke=(c.s===curSpoke)?(curSpoke+1)%n:((curSpoke-1+n)%n);
const myEnd = (c.s===curSpoke) ? {x:c.x1,y:c.y1} : {x:c.x2,y:c.y2};
const otherEnd = (c.s===curSpoke) ? {x:c.x2,y:c.y2} : {x:c.x1,y:c.y1};
pts.push(`L ${myEnd.x.toFixed(1)} ${myEnd.y.toFixed(1)}`);
pts.push(`L ${otherEnd.x.toFixed(1)} ${otherEnd.y.toFixed(1)}`);
curSpoke=nextSpoke;
}
pts.push(`L 0 0`);
const pathStr=pts.join(' ');
h+=`<path class="route-trace-rule" d="${pathStr}" />`;
const sA=(bestStart*angle-90)*Math.PI/180;
const slx=(r2+18)*Math.cos(sA), sly=(r2+18)*Math.sin(sA);
h+=`<circle cx="${slx.toFixed(1)}" cy="${sly.toFixed(1)}" r="14" fill="none" stroke="#00d4ff" stroke-width="2"><animate attributeName="r" values="14;20;14" dur="1.5s" repeatCount="indefinite"/></circle>`;
if(opts.showSurvivorLabel){
const llx=(r2+58)*Math.cos(sA), lly=(r2+58)*Math.sin(sA);
const txtAnchor = Math.abs(Math.cos(sA))<0.2 ? 'middle' : (Math.cos(sA)>0 ? 'start' : 'end');
h+=`<g style="pointer-events:none">
<rect x="${(llx-44).toFixed(1)}" y="${(lly-12).toFixed(1)}" width="88" height="24" rx="4" fill="rgba(10,10,9,.88)" stroke="#ef9f27" stroke-width="1"/>
<text x="${llx.toFixed(1)}" y="${lly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#ef9f27" font-weight="700" letter-spacing="1">最終生存者</text>
</g>`;
}
}
const vbR = opts.showSurvivorLabel ? 260 : 220;
return `<svg class="mini-amida" viewBox="-${vbR} -${vbR} ${vbR*2} ${vbR*2}" xmlns="http://www.w3.org/2000/svg">${h}</svg>`;
}

function adjustTimer(deltaSec){
const next=timerSec+deltaSec;
if(next<0) timerSec=0;
else if(next>timerMax) timerSec=timerMax;
else timerSec=next;
const el=document.getElementById('centerTimer');
if(el){
const m=Math.floor(timerSec/60), s=timerSec%60;
el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
el.className='ts-timer'+(timerSec<=60?' danger':(timerSec<=120?' warn':''));
}
if(timerSec===0 && timerRunning){
clearInterval(timerInt); timerRunning=false;
}
updateAdjBtnDisabled();

function updateAdjBtnDisabled(){
const minus=document.getElementById('timerMinus');
const plus=document.getElementById('timerPlus');
if(minus) minus.disabled=(timerSec<=0);
if(plus)  plus.disabled =(timerSec>=timerMax);
}
let _finalResults=[];
function computeFinalResults(){
const rate=100000000;
const results=players.map((p,i)=>{
if(isPhantom(p)) return null;
return {
p,i,
chips:chips[i]||0,
earned:(chips[i]||0)*rate,
net:(chips[i]||0)*rate-rate
};
}).filter(r=>r!==null).sort((a,b)=>b.net-a.net);
results.forEach((r,idx)=>{
if(idx===0 || results[idx].net!==results[idx-1].net) r.rank=idx+1;
else r.rank=results[idx-1].rank;
});
_finalResults=results;
return results;
}
function renderFinalReveal(content){
const results=computeFinalResults();
const maxNet=results.length?results[0].net:0;
const confirmed=chipsConfirmed;       // チップ確定フラグを優先
function fmtMoney(v){
if(v===0) return '0L$';
const sign=v>0?'+':'-';
return `${sign}${Math.abs(v).toLocaleString()}L$`;
}
function pnlStr(r){
if(!confirmed) return '';
return fmtMoney(r.net);
}
function pnlColor(r){ return r.net>=0?'var(--green)':'var(--red)'; }
function chipStr(r){ return confirmed?`${r.chips}チップ`:''; }
function prizeStr(r){ return confirmed?`獲得賞金 ${fmtMoney(r.net)}`:''; }
const rankGroups=[];
results.forEach(r=>{
const last=rankGroups[rankGroups.length-1];
if(last && last[0].rank===r.rank) last.push(r);
else rankGroups.push([r]);
});
const NG=rankGroups.length;
function heightPctOf(gIdx){
if(NG<=1) return 96;
const weights=[];
for(let i=0;i<NG;i++) weights.push(NG+2-i);
const total=weights.reduce((a,b)=>a+b,0);
const usable=NG<=3 ? 96 : (NG<=5 ? 94 : 92);
return (weights[gIdx]/total)*usable;
}
function fr_card(r, sizeKey){
const rev=revealState[r.i];
const isWinner=r.net===maxNet&&confirmed;
const cls=`fr-card fr-size-${sizeKey} ${rev?'revealed':''} ${isWinner&&rev?'winner':''}`;
return `<div class="${cls}" onclick="event.stopPropagation();revealCard(${r.i})">
<div class="fr-rank ${isWinner?'win':''}">${r.rank} 位</div>
<div class="fr-alpha">${r.p.alpha||'?'}</div>
<div class="fr-name">${rev?r.p.name:'???'}</div>
${rev&&confirmed?`
<div class="fr-chips">${chipStr(r)}</div>
<div class="fr-money" style="color:${pnlColor(r)}">${prizeStr(r)}</div>
`:''}
</div>`;
}
function sizeKeyFor(gIdx){
if(gIdx===0) return '1';
if(gIdx===1) return '2';
if(gIdx===2) return '3';
return 'rest';
}
const rowsHtml = rankGroups.map((group,gIdx)=>{
const pct=heightPctOf(gIdx);
const sz=sizeKeyFor(gIdx);
return `<div class="fr-row" data-size="${sz}" style="height:${pct.toFixed(2)}%">
${group.map(r=>fr_card(r,sz)).join('')}
</div>`;
}).join('');
content.innerHTML=`<div class="fr-wrap">
<div class="fr-header">
<div class="fr-title">FINAL RESULT${confirmed?'':' — チップ未確定'}</div>
<div class="fr-actions">
<button class="rev-btn" onclick="event.stopPropagation();revealState.fill(true);renderSlide()">全員開示</button>
<button class="rev-btn" onclick="event.stopPropagation();revealState=Array(N).fill(false);renderSlide()">リセット</button>
</div>
</div>
<div class="fr-rows">
${rowsHtml}
</div>
</div>`;
}
function revealCard(i){
const results=_finalResults.length?_finalResults:computeFinalResults();
const target=results.find(r=>r.i===i);
if(target){
results.forEach(r=>{ if(r.net===target.net) revealState[r.i]=true; });
} else {
revealState[i]=true;
}
renderSlide();
}
function startFrom(mode){
document.getElementById('startPickerModal').style.display='none';
if(!slides.length){ renderSlide(); return; }
let target=0;
if(mode==='rule'){
target=slides.findIndex(s=>s.type==='rule')>=0 ? slides.findIndex(s=>s.type==='rule') : 0;
} else if(mode==='place'){
const i=slides.findIndex(s=>s.type==='place-init');
target=i>=0 ? i : 0;
} else if(mode==='main'){
let i=slides.findIndex(s=>s.type==='honsen-start');
if(i<0) i=slides.findIndex(s=>s.type==='turn-start');
if(i<0) i=slides.findIndex(s=>s.type==='eyecatch');
target=i>=0 ? i : 0;
}
curSlide=target;
revealState=Array(N).fill(false);
renderSlide();
updateDots();
}
async function nextSlide(){
if(!slides.length) return;
if(curSlide<slides.length-1){
const wasEyecatch=slides[curSlide].type==='eyecatch';
try{ await reloadSessionLatest(); buildSlides(); }catch(e){}
curSlide++;
if(curSlide>=slides.length) curSlide=slides.length-1;
if(slides[curSlide].type!=='final-reveal') revealState=Array(N).fill(false);
renderSlide();
updateDots();
if(wasEyecatch&&!document.fullscreenElement){
document.documentElement.requestFullscreen().catch(()=>{});
}
}
}
async function prevSlide(){
if(curSlide>0){
try{ await reloadSessionLatest(); buildSlides(); }catch(e){}
curSlide--;
if(curSlide<0) curSlide=0;
if(slides[curSlide].type!=='final-reveal') revealState=Array(N).fill(false);
renderSlide();
updateDots();
}
}
function updateDots(){
const el=document.getElementById('progressDots');
if(!el||!slides.length) return;
const total=slides.length;
if(total<=30){
el.innerHTML=slides.map((_,i)=>`<div class="pdot2 ${i===curSlide?'cur':i<curSlide?'done':''}"></div>`).join('');
} else {
el.innerHTML=`<span style="font-size:10px;color:var(--text3)">${curSlide+1} / ${total}</span>`;
}
}
function toggleFullscreen(){
if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
else document.exitFullscreen().catch(()=>{});
}
document.getElementById('stage').addEventListener('click',e=>{
if(document.getElementById('sessionOverlay').style.display!=='none') return;
const tag=e.target.tagName;
if(tag==='BUTTON'||tag==='SELECT'||tag==='INPUT') return;
if(e.target.closest('.rcard')||e.target.closest('.rev-btn')||e.target.closest('.ts-timer')||e.target.closest('.ts-timer-ctrl')) return;
nextSlide();
});
document.addEventListener('keydown',e=>{
if(document.getElementById('sessionOverlay').style.display!=='none') return;
if(e.target.tagName==='INPUT') return;
if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();nextSlide();}
else if(e.key==='ArrowLeft'){e.preventDefault();prevSlide();}
else if(e.key==='f'||e.key==='F') toggleFullscreen();
else if(e.key==='t'||e.key==='T') toggleTurnTimer();
else if(e.key==='s'||e.key==='S') openSessionPicker();
});
</script>
